name: kc-pay-formal-preflight
services:
  preflight:
    build:
      context: .
      dockerfile: Dockerfile.preflight
    init: true
    restart: "no"
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2
    command: ["xvfb-run", "-a", "--server-args=-screen 0 1365x900x24 -nolisten tcp", "node", "scripts/check-formal-checkout.cjs"]
    environment:
      PERSISTENT_PROFILE_DIR: /profiles/formal
      PREFLIGHT_SESSION_FILE: /run/secrets/session.json
      PREFLIGHT_PROXY: ${PREFLIGHT_PROXY:-}
      PREFLIGHT_COUNTRY: ${PREFLIGHT_COUNTRY:-PH}
      PREFLIGHT_PLAN: ${PREFLIGHT_PLAN:-plus}
    volumes:
      - browser_profile:/profiles
      - type: bind
        source: ${PREFLIGHT_SESSION_FILE:-./session.json}
        target: /run/secrets/session.json
        read_only: true
    extra_hosts:
      - host.docker.internal:host-gateway
volumes:
  browser_profile:
