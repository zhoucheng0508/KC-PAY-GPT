# Explicit -f avoids loading the workstation's docker-compose.override.yml.
name: kc-pay-preflight
services:
  preflight:
    build:
      context: .
      dockerfile: Dockerfile.preflight
    init: true
    restart: "no"
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2
    environment:
      PREFLIGHT_TRANSPORT: ${PREFLIGHT_TRANSPORT:-browser}
      PREFLIGHT_PROXY: ${PREFLIGHT_PROXY:-}
      PREFLIGHT_PLAN: ${PREFLIGHT_PLAN:-plus}
      PREFLIGHT_COUNTRY: ${PREFLIGHT_COUNTRY:-PH}
    volumes:
      - type: bind
        source: ${PREFLIGHT_SESSION_FILE:-./session.json}
        target: /run/secrets/session.json
        read_only: true
    extra_hosts:
      - host.docker.internal:host-gateway
